<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EdgarDash{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <nav>
    <a class="brand" href="/">📊 EdgarDash</a>
    <a href="/">Dashboard</a>
    <a href="/filings">Filings</a>
    <a href="/digest">Daily digest</a>
    <form class="watchform" action="/watchlist" method="post">
      <input name="ticker" placeholder="Add ticker (e.g. AAPL)" maxlength="10" required>
      <button type="submit">+ Watch</button>
    </form>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>Data: SEC EDGAR (companyfacts + submissions) and Stooq prices. Educational research tool — not investment advice.</p>
</footer>
</body>
</html>
